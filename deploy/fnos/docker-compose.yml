# private-tiku · 飞牛 NAS（fnOS）部署编排
#
# 适用环境
#   设备  ：飞牛 NAS（fnOS），x86_64（本编排使用 Docker Hub 上的 linux/amd64 镜像）
#   目录  ：/vol1/1000/docker/private-tiku
#   方式  ：直接拉取 Docker Hub 镜像运行，NAS 上不需要源码
#
# 首次部署前必须登录（该镜像仓库是私有的，匿名 pull 会返回 401）：
#   docker login -u 303528084        # 密码填 Docker Hub Access Token（Read 权限即可，勿用登录密码）
#
# 用法
#   cp .env.example .env             # 按需修改端口 / 时区 / 数据目录
#   docker compose pull
#   docker compose up -d
#   docker compose ps
#   浏览器打开 http://<NAS_IP>:8000

name: private-tiku

services:
  tiku:
    # 镜像名与标签都能用 .env 覆盖；默认拉 Docker Hub 上 CI 推送的 latest
    image: ${TIKU_IMAGE:-303528084/private-tiku}:${TIKU_TAG:-latest}
    container_name: private-tiku
    restart: unless-stopped

    ports:
      # 左边是宿主机端口（可改），右边容器内固定 8000，不要动
      - "${TIKU_PORT:-8000}:8000"

    environment:
      # 数据根目录：SQLite 库 + 上传的原始文件，由下面的 volumes 映射到宿主机
      TIKU_DATA_DIR: /app/data
      # 容器内监听端口必须与 Dockerfile 的 EXPOSE 8000 一致，不要跟着宿主机端口变量走
      TIKU_PORT: "8000"
      # python:3.11-slim 官方镜像内置 tzdata，TZ 会真正生效。
      # 后端 DDL 用 datetime('now','localtime')，不设 TZ 会按 UTC 落库（时间戳差 8 小时）
      TZ: ${TZ:-Asia/Shanghai}

    volumes:
      # 所有持久化数据都在宿主机这个目录；不要放进 git 仓库或同步盘
      - "${TIKU_DATA_PATH:-./data}:/app/data"

    healthcheck:
      # 必须打容器内 127.0.0.1:8000（不是宿主机映射端口）；镜像内自带 python
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      # 首次启动要建库并初始化 FTS5 索引，给足启动时间再判失败
      start_period: 15s

    logging:
      # NAS 长期运行：单文件 10MB、最多 3 份，防止日志涨爆磁盘
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - "no-new-privileges:true"

# 未设置 pull_policy: always —— NAS 断网/离线时仍可用本地镜像正常重启。

